# kube-prometheus-stack 超軽量設定 (Minimal Footprint)
# 対象: GPD Pocket3 (Ubuntu 26.04: メモリ 8GB〜16GB UMPC 環境)
#
# 設計方針:
# 1. Prometheus メモリ使用量を 256Mi〜512Mi に厳格に抑制 (デフォルトの 1.5GB〜2GB から大幅削減)
# 2. スクレイプ間隔を 30s に延長し、時系列データ生成量と CPU 負荷を半減
# 3. データ保持期間を 2日 (2Gi) に設定し、観測用 NVMe SSD の容量を圧迫しない
# 4. k3s で露出していないコンポーネント (etcd, scheduler 等) のスクレイプを無効化
# 5. Alertmanager を無効化してメモリをさらに 250MB 節約

# Prometheus Operator 自体のリソース制限
prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 200m
      memory: 200Mi

# Prometheus サーバ本体の設定
prometheus:
  enabled: true
  prometheusSpec:
    # スクレイプと評価の間隔 (秒)
    scrapeInterval: "30s"
    evaluationInterval: "30s"
    
    # データ保持ポリシー (ディスク極小化)
    retention: "2d"
    retentionSize: "2Gi"
    
    # メモリ & CPU 制限 (最低スペック保証)
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    
    # レプリカ数は 1 (単一ノード PoC)
    replicas: 1
    
    # 不要なボリュームの無効化
    storageSpec: {}

# Alertmanager 設定 (初期PoCではメモリ節約のため false、Discord通知を有効化する際は true に変更)
alertmanager:
  enabled: false
  # 有効化時のリソース制限 (最小構成)
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 50m
        memory: 128Mi
  # Alertmanager ネイティブ Discord Webhook 設定例 (v0.25+)
