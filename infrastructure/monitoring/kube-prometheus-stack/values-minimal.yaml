  #       message: '{{ .CommonAnnotations.description }}'

# Grafana ダッシュボード設定
grafana:
  enabled: true
  adminPassword: "admin"
  
  # リソース制限
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 200m
      memory: 200Mi
  
  # ブラウザから直接アクセスできるよう NodePort を設定 (ポート 30080)
  service:
    type: NodePort
    nodePort: 30080

# ホストメトリクス収集 (node-exporter)
nodeExporter:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

# K8s オブジェクト状態メトリクス (kube-state-metrics)
kubeStateMetrics:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 50m
      memory: 128Mi

# k3s では外部露出していない標準コンポーネントのスクレイプを無効化
kubeScheduler:
  enabled: false

kubeControllerManager:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false
