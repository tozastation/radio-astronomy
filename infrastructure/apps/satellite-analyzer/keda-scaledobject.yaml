apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: satellite-analyzer-scaledobject
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: satellite-analyzer-worker
  minReplicaCount: 0
  maxReplicaCount: 2
  cooldownPeriod: 60
  pollingInterval: 10
  triggers:
    # satellite-viewer の /api/pending-tasks を直接ポーリングして未処理録音があれば 0 -> 1 起動
    - type: metrics-api
      metadata:
        url: "http://satellite-viewer.default.svc.cluster.local:8080/api/pending-tasks"
        valueLocation: "pending_count"
        targetValue: "1"
        activationTargetValue: "0"
        format: "json"
