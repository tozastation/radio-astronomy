apiVersion: apps/v1
kind: Deployment
metadata:
  name: satellite-tracker
  namespace: default
  labels:
    app: satellite-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: satellite-tracker
  template:
    metadata:
      labels:
        app: satellite-tracker
    spec:
      nodeSelector:
        node-role.kubernetes.io/edge: ""
      tolerations:
        - key: "node-role.kubernetes.io/edge"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: tracker
          image: localhost:5000/satellite-tracker-rs:v1.1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 9100
              name: metrics
          securityContext:
            privileged: true
          env:
            # 観測地点: プライバシー保護のため広域公称値（東京都庁）を採用（受信感度への影響なし）
            - name: OBSERVER_LATITUDE
              value: "35.6895"
            - name: OBSERVER_LONGITUDE
              value: "139.6917"
            - name: OBSERVER_ELEVATION_M
              value: "30.0"
            - name: BALCONY_FACING
              value: "NORTH"
            - name: MOCK_SDR
              value: "false"
            - name: METRICS_PORT
              value: "9100"
            - name: UPDATE_INTERVAL_SEC
              value: "2.0"
            - name: SPOOL_DIR
              value: "/tmp/spool"
            # Garage S3 連携設定 (エッジノードからの名前解決制約に対応しホストNodePortを指定)
            - name: GARAGE_S3_ENDPOINT
              value: "http://192.168.68.66:30900"
            - name: GARAGE_BUCKET
              value: "satellite-recordings"
            - name: GARAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-satellite-credentials
                  key: access_key
                  optional: true
            - name: GARAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-satellite-credentials
                  key: secret_key
                  optional: true
          resources:
            requests:
              cpu: 30m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 64Mi
          volumeMounts:
            - name: dev-bus-usb
              mountPath: /dev/bus/usb
            - name: spool-dir
              mountPath: /tmp/spool
      volumes:
        - name: dev-bus-usb
          hostPath:
            path: /dev/bus/usb
        - name: spool-dir
          hostPath:
            path: /tmp/satellite-recordings
