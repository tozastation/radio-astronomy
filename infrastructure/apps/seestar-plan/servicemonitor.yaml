apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: seestar-plan
  namespace: default
  labels:
    release: kube-prometheus-stack
    app: seestar-plan
spec:
  selector:
    matchLabels:
      app: seestar-plan
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
      path: /metrics
