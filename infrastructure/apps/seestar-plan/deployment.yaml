apiVersion: apps/v1
kind: Deployment
metadata:
  name: seestar-plan
  namespace: default
  labels:
    app: seestar-plan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seestar-plan
  template:
    metadata:
      labels:
        app: seestar-plan
    spec:
      containers:
        - name: plan
          image: localhost:5000/seestar-plan:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 30089
              name: http
          env:
            - name: PORT
              value: "30089"
            - name: OBSERVER_LATITUDE
              value: "35.6895"
            - name: OBSERVER_LONGITUDE
              value: "139.6917"
            - name: ALT_RIDGE_DEG
              value: "10"
            - name: ALT_MAX_DEG
              value: "85"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 30089
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: seestar-plan
  namespace: default
  labels:
    app: seestar-plan
spec:
  type: NodePort
  selector:
    app: seestar-plan
  ports:
    - name: http
      port: 30089
      targetPort: 30089
      nodePort: 30089
