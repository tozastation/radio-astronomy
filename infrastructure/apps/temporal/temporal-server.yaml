apiVersion: v1
kind: Namespace
metadata:
  name: temporal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-server
  namespace: temporal
  labels:
    app: temporal-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-server
  template:
    metadata:
      labels:
        app: temporal-server
    spec:
      containers:
        - name: temporal
          image: temporalio/temporal:latest
          imagePullPolicy: IfNotPresent
          command:
            - temporal
            - server
            - start-dev
            - --ip=0.0.0.0
            - --ui-ip=0.0.0.0
            - --db-filename=/data/temporal.db
          ports:
            - name: grpc
              containerPort: 7233
            - name: ui
              containerPort: 8233
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-server
  namespace: temporal
  labels:
    app: temporal-server
spec:
  type: ClusterIP
  selector:
    app: temporal-server
  ports:
    - name: grpc
      port: 7233
      targetPort: 7233
    - name: ui
      port: 8233
      targetPort: 8233
