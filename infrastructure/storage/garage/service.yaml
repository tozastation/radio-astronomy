apiVersion: v1
kind: Service
metadata:
  name: garage-s3
  namespace: storage
  labels:
    app: garage
spec:
  type: NodePort
  selector:
    app: garage
  ports:
    - name: s3-api
      port: 3900
      targetPort: 3900
      nodePort: 30900
    - name: admin-api
      port: 3903
      targetPort: 3903
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: storage
  labels:
    app: garage
spec:
  clusterIP: None
  selector:
    app: garage
  ports:
    - name: rpc
      port: 3901
      targetPort: 3901
