apiVersion: apps/v1
kind: Deployment
metadata:
  name: satellite-viewer
  namespace: default
  labels:
    app: satellite-viewer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: satellite-viewer
  template:
    metadata:
      labels:
        app: satellite-viewer
    spec:
      containers:
        - name: viewer
          image: localhost:5000/satellite-viewer:v1.1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: garage-satellite-credentials
                  key: access_key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-satellite-credentials
                  key: secret_key
            - name: S3_ENDPOINT_URL
              value: "http://garage-s3.storage.svc.cluster.local:3900"
            - name: S3_BUCKET
              value: "satellite-recordings"
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: satellite-viewer
  namespace: default
  labels:
    app: satellite-viewer
spec:
  type: NodePort
  selector:
    app: satellite-viewer
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30088
