[project]
name = "radio-astronomy-analytics"
version = "0.1.0"
description = "DuckDB + dbt-duckdb + lightweight ontology layer for radio-astronomy"
requires-python = ">=3.12,<3.14"
dependencies = [
    "duckdb>=1.1.0",
    "dbt-duckdb>=1.9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
