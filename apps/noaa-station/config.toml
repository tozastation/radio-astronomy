[observer]
latitude = 35.7903    # 東京都青梅市
longitude = 139.2584  # 東経 139.2584
altitude_m = 200.0    # 標高 (m)


[scheduler]
min_elevation_deg = 20.0
pre_alert_minutes = 3.0
tle_update_interval_hours = 24

[voicevox]
enabled = true
host = "http://localhost:50021"
speaker_id = 3
timeout_secs = 15


[storage]
output_dir = "data/noaa"

[sdr]
gain = 45.0          # チューナー利得 (dB)。宇宙からの微弱信号には 40.0〜49.6 の高利得が必須
sample_rate = 60000  # SDRサンプリングレート (60kHz)
ppm_error = 0        # 周波数偏差補正 (PPM)
